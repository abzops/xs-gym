<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>XS Gym has moved</title>
<script>
  // XS Gym now lives at https://gym.xelorsoft.com. Keep the page, query and hash.
  (function () {
    var path = location.pathname.replace(/^\/xs-gym(?=\/|$)/, '') || '/';
    location.replace('https://gym.xelorsoft.com' + path + location.search + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://gym.xelorsoft.com/"></noscript>

</head>
<body>

</body>
