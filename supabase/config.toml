# Edge Functions. xs-ai verifies the caller's JWT at the gateway and again
# inside the function (RLS and command-function permission checks).
[functions.xs-ai]
verify_jwt = true

[functions.staff-login]
verify_jwt = true

# Subscription billing (Razorpay payment links). The app calls xs-billing as the
# signed-in owner; Razorpay calls the webhook, which checks Razorpay's signature itself.
[functions.xs-billing]
verify_jwt = true

[functions.xs-billing-webhook]
verify_jwt = false
