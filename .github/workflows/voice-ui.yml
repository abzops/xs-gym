# Real Chromium browser tests, with simulated speech events and gym data.
# Screenshots are captured by Playwright, not generated artwork.
name: XS AI voice UI

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/text-only-live-voice']
    paths:
      - 'src/features/ai/**'
      - 'supabase/functions/xs-ai/**'
      - 'tests/ui/live-voice.mjs'
      - '.github/workflows/voice-ui.yml'

permissions:
  contents: read

concurrency:
  group: xs-text-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  microphone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://knuanihnxtxtyrgvsumq.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2NshKjNCOJkokq3z0bezrw_21Dl7t-j
      VITE_BASE_PATH: /xs-gym/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify all XS Gym audio recording and transcription code is gone
        run: |
          test ! -e src/features/ai/recorder.ts
          test ! -e supabase/functions/xs-ai/stt.ts
          test ! -e src/lib/sttFallback.test.ts
          if grep -nE 'startRecording|canRecord|MediaRecorder|\.getUserMedia\(|transcribe:' src/features/ai/XsAi.tsx src/features/ai/voice.ts; then
            echo "Found prohibited audio transport code"
            exit 1
          fi
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local GitHub Pages build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/xs-voice-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/xs-gym/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/xs-voice-preview.log
          exit 1
      - name: Prove English and Malayalam live text with zero audio requests
        run: |
          node tests/ui/live-voice.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/" "/tmp/xs-voice-proof"
      - name: Upload actual application screenshots and assertions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xs-ai-text-only-local-proof
          path: |
            /tmp/xs-voice-proof/
            /tmp/xs-voice-preview.log
          retention-days: 14
