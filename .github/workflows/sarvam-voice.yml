name: Sarvam voice POC (isolated, no deployment)
on:
  push:
    branches: ['feature/sarvam-realtime-malayalam-poc-20261112', 'fix/malayalam-real-audio-provider-20261113', 'fix/xsai-malayalam-error-recovery-20261113', 'fix/xsai-auto-malayalam-repeat-voice-20261113']
  workflow_dispatch:
env:
  VITE_SUPABASE_URL: https://sarvamvoicepoc.supabase.co
  XS_TEST_SUPABASE_REF: sarvamvoicepoc
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_test_only_public_1234567890
  VITE_BASE_PATH: /xs-gym/
jobs:
  safety:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node tests/ai/sarvam-contract.check.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/xs-ai-sarvam/index.ts
      - name: Query REAL production Sarvam configuration (no user audio)
        env:
          XS_PRODUCTION_SUPABASE_URL: https://knuanihnxtxtyrgvsumq.supabase.co
          XS_PRODUCTION_PUBLISHABLE_KEY: sb_publishable_2NshKjNCOJkokq3z0bezrw_21Dl7t-j
        run: node tests/ai/sarvam-live-readiness.mjs
      - name: Synthetic mobile and desktop voice regression
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/sarvam-voice-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/xs-gym/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/xs-gym/ >/dev/null
          node tests/ui/live-voice.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/"
          node tests/ui/sarvam-voice.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/"
          node tests/ui/malayalam-real-fallback.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/"
          node tests/ui/ios-malayalam-repeat.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/"
      - name: Ensure no provider secret appears in the app build
        run: |
          if grep -rEn "SARVAM_API_KEY|api[.]sarvam[.]ai|api-subscription-key" dist/; then
            echo "Unsafe provider credential reference in browser" >&2
            exit 1
          fi
