name: Sarvam voice POC (isolated, no deployment)
on:
  push:
    branches: ['feature/sarvam-realtime-malayalam-poc-20261112']
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node tests/ai/sarvam-contract.check.mjs
      - name: Ensure no provider secret appears in the app build
        run: |
          if grep -rEn "SARVAM_API_KEY|api[.]sarvam[.]ai|api-subscription-key" dist/; then
            echo "Unsafe provider credential reference in browser" >&2
            exit 1
          fi
