# Checks, builds and publishes the app to GitHub Pages (gh-pages branch).
# The Supabase URL and publishable key are public by design; all access is
# enforced by row level security and command functions in the database.
name: Test and deploy

on:
  push:
    branches: [main, analytics-onboarding, 'fix/malayalam-voice-access', 'fix/live-voice-interim-transcription', 'fix/text-only-xs-ai-voice', 'fix/member-payment-edit-delete-archive', 'feat/member-swipe-archive-delete', 'fix/one-tap-delete-warning-20261111', 'feat/edit-member-joining-date-20261111', 'fix/browser-malayalam-speech-20261112', 'feature/hold-to-talk-browser-voice-20261112', 'feature/xs-ai-minimal-voice-settings-20261112', 'feature/xs-ai-agent-workspace', 'fix/xs-ai-malayalam-mobile-cleanup-20261112', 'feature/draggable-xs-ai-hold-to-talk-20261112', 'fix/xsai-malayalam-error-recovery-20261113', 'fix/malayalam-real-audio-provider-20261113']
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://knuanihnxtxtyrgvsumq.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2NshKjNCOJkokq3z0bezrw_21Dl7t-j
  VITE_BASE_PATH: /xs-gym/

jobs:
  app:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: XS AI text-only HTTP security contract
        run: node --experimental-strip-types tests/ai/http.check.mjs
      - run: npm run build
      # Deployment is forbidden until the browser speech regression suite
      # passes, including English and the alternate Malayalam tag. The suite
      # mocks native SpeechRecognition and never contacts customer databases.
      - name: Install isolated browser regression harness
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install chromium
      - name: Verify browser speech before publishing
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/xs-voice-gate.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/xs-gym/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/xs-gym/ >/dev/null
          node tests/ui/live-voice.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/"
          node tests/ui/floating-ai.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/"
          node tests/ui/malayalam-real-fallback.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/"
      - name: Secret scan of the published bundle
        run: |
          # Real key shapes only: Supabase secret keys, any JWT (service-role or
          # legacy anon), provider keys, private keys. Bare prefixes are not keys.
          if grep -rEno "sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY" dist/; then
            echo "Possible secret in dist/ — refusing to publish." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  database:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Migrations and database tests on PostgreSQL 16
        run: bash tests/db/run.sh

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [app, database]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "abzops"
          git config user.email "87251316+abzops@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
