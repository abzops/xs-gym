# Checks and builds the app, publishes it to branch cf-deploy (served at gym.xelorsoft.com
# by the Cloudflare Worker xs-gym) and keeps gh-pages as a redirect from the old address.
# The Supabase URL and publishable key are public by design; all access is
# enforced by row level security and command functions in the database.
name: Test and deploy

on:
  push:
    branches: [main, 'feat/cloudflare-gym-domain-20261118']
  # Checks only for pull requests: the deploy job runs for main alone.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://knuanihnxtxtyrgvsumq.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2NshKjNCOJkokq3z0bezrw_21Dl7t-j
  VITE_BASE_PATH: /xs-gym/

jobs:
  app:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: XS AI HTTP security contract
        run: node --experimental-strip-types tests/ai/http.check.mjs
      - name: Staff login function security contract
        run: node --experimental-strip-types tests/staff/login.check.mjs
      - name: Billing functions contract (checkout, webhook signatures, replays)
        run: node --experimental-strip-types tests/billing/billing.check.mjs
      - run: npm run build
      # Deployment is blocked until the XS AI browser suite passes: chat,
      # approval cards (Approve / Cancel / Undo), microphone round trip and the
      # floating launcher, on phone and laptop, light and dark. All APIs mocked.
      - name: Install isolated browser regression harness
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install chromium
      - name: Verify XS AI in a browser before publishing
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/xs-ai-gate.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/xs-gym/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/xs-gym/ >/dev/null
          node tests/ui/xs-ai.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/"
          node tests/ui/floating-ai.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/"
          mkdir -p /tmp/xs-ai-screens/billing
          node tests/ui/billing.mjs "$(pwd)/node_modules/playwright/index.js" "http://127.0.0.1:4173/xs-gym/" /tmp/xs-ai-screens/billing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xs-ai-screens
          path: /tmp/xs-ai-screens
          retention-days: 7
      - name: Secret scan of the published bundle
        run: |
          # Real key shapes only: Supabase secret keys, any JWT (service-role or
          # legacy anon), provider keys, private keys. Bare prefixes are not keys.
          if grep -rEno "sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY" dist/; then
            echo "Possible secret in dist/ — refusing to publish." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
      # Same app built for the site root: served at https://gym.xelorsoft.com
      # by the Cloudflare Worker `xs-gym` (worker/index.js) from branch cf-deploy.
      - name: Build for gym.xelorsoft.com
        env:
          VITE_BASE_PATH: /
        run: |
          npx vite build --outDir dist-cf --emptyOutDir
          if grep -rEno "sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY" dist-cf/; then
            echo "Possible secret in dist-cf/ — refusing to publish." >&2
            exit 1
          fi
          grep -q '"/assets/' dist-cf/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cf
          path: dist-cf
          retention-days: 7

  database:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Migrations and database tests on PostgreSQL 16
        run: bash tests/db/run.sh
      - name: Subscription migration upgrade, rollback and re-upgrade on pilot-shaped data
        run: bash tests/db/migration_safety.sh

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [app, database]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-cf
          path: dist-cf
      - name: Publish to cf-deploy (gym.xelorsoft.com)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist-cf
          git init -q -b cf-deploy
          git config user.name "abzops"
          git config user.email "87251316+abzops@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cf-deploy
      # The old address abzops.github.io/xs-gym/ now only forwards to gym.xelorsoft.com,
      # keeping the path, so bookmarks and home-screen icons still land in the app.
      - uses: actions/checkout@v6
        with:
          path: src
          sparse-checkout: hosting/github-pages-redirect
      - name: Publish redirect to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src/hosting/github-pages-redirect
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "abzops"
          git config user.email "87251316+abzops@users.noreply.github.com"
          git add -A
          git commit -q -m "Redirect to gym.xelorsoft.com (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
