# Checks, builds and publishes the app to GitHub Pages (gh-pages branch).
# The Supabase URL and publishable key are public by design; all access is
# enforced by row level security and command functions in the database.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://knuanihnxtxtyrgvsumq.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2NshKjNCOJkokq3z0bezrw_21Dl7t-j
  VITE_BASE_PATH: /xs-gym/

jobs:
  app:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Secret scan of the published bundle
        run: |
          if grep -rEn "service_role|sb_secret_|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY" dist/; then
            echo "Possible secret in dist/ — refusing to publish." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  database:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Migrations and database tests on PostgreSQL 16
        run: bash tests/db/run.sh

  deploy:
    needs: [app, database]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "abzops"
          git config user.email "87251316+abzops@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
