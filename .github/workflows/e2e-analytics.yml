name: Full XS Gym end-to-end (isolated)

on:
  push:
    branches: [analytics-onboarding, main, 'fix/text-only-xs-ai-voice', 'fix/member-payment-edit-delete-archive', 'feat/member-swipe-archive-delete', 'fix/one-tap-delete-warning-20261111', 'feat/edit-member-joining-date-20261111', 'fix/xs-ai-malayalam-mobile-cleanup-20261112', 'feature/sarvam-realtime-malayalam-poc-20261112']
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/xs-ai/**'
      - 'tests/e2e/**'
      - 'tests/ai/**'
      - '.github/workflows/e2e-analytics.yml'
  workflow_dispatch:

concurrency:
  group: xs-full-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [phone, tablet, laptop]
    env:
      PG_RUN_AS: runner
      E2E_OUT: ${{ github.workspace }}/tests/e2e/out
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and Python Playwright
        run: |
          python3 -m venv /tmp/xs-e2e-python
          /tmp/xs-e2e-python/bin/pip install --disable-pip-version-check playwright
          /tmp/xs-e2e-python/bin/python -m playwright install --with-deps chromium
      - name: Run complete ${{ matrix.device }} flow on real PostgreSQL migrations
        run: |
          export PATH="/tmp/xs-e2e-python/bin:$PATH"
          bash tests/e2e/run.sh "${{ matrix.device }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xs-e2e-debug-${{ matrix.device }}
          path: tests/e2e/out/
          retention-days: 3
